name: check

on:
  push:
  pull_request:

jobs:
  self-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 这个包自己也要守规则
        run: python3 tools/pce.py check --strict
